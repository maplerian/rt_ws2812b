name: CI - STM32F407 Compile Matrix

'on':
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stm32f407-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stm32f407-build:
    name: STM32F407 / ${{ matrix.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        profile:
          - static-minimal
          - dynamic-auto
          - timing-table-extended
          - timing-search
          - gamma-lut
          - gamma-compute
          - effect-minimal
          - effect-all-msh
          - sparse-slots
          - effect-sequence-only
    env:
      RTTHREAD_REF: master
      RTTHREAD_ENV_REF: master
      RTTHREAD_BSP: bsp/stm32/stm32f407-atk-explorer
      WS2812B_CI_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Checkout WS2812B
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python for RT-Thread SCons and Env tools
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/ci/ws2812b/requirements-build.txt
      - name: Install STM32 cross compiler and RT-Thread build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            gcc-arm-none-eabi libnewlib-arm-none-eabi git make
          python -m pip install --disable-pip-version-check \
            -r .github/ci/ws2812b/requirements-build.txt
          arm-none-eabi-gcc --version
          scons --version
      - name: Build and link RT-Thread STM32F407 profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci/logs
          sh .github/ci/ws2812b/build-stm32f407.sh "$WS2812B_CI_PROFILE" \
            2>&1 | tee "_ci/logs/stm32f407-${WS2812B_CI_PROFILE}.log"
      - name: Upload STM32F407 build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ws2812b-stm32f407-${{ matrix.profile }}
          path: |
            _ci/logs/stm32f407-${{ matrix.profile }}.log
            _ci/ws2812b-profile-${{ matrix.profile }}.h
            _ci/ws2812b-revisions-${{ matrix.profile }}.txt
            _ci/rt-thread/bsp/stm32/stm32f407-atk-explorer/rt-thread.elf
          if-no-files-found: warn
          retention-days: 14
